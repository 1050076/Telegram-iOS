name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /Library/Android /usr/local/lib/android /usr/local/share/chromium /usr/local/share/edge_driver 2>/dev/null || true
          sudo rm -rf /Users/runner/Library/Android 2>/dev/null || true
          df -h /

      - name: Set active Xcode path
        run: |
          ls /Applications/ | grep -i xcode || true
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Build the App
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # collect ipa (newer bazel layouts place it under bazel-bin/; fall back to a find)
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          IPA=""
          for candidate in bazel-bin/Telegram/Telegram.ipa bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            for f in $candidate; do
              if [ -f "$f" ]; then IPA="$f"; break 2; fi
            done
          done
          if [ -z "$IPA" ]; then
            IPA="$(find -L bazel-out bazel-bin -maxdepth 8 -name 'Telegram.ipa' -type f 2>/dev/null | head -1 || true)"
          fi
          if [ -z "$IPA" ]; then
            echo "Telegram.ipa not found anywhere under bazel-out/bazel-bin" >&2
            find -L bazel-out -maxdepth 6 -name 'Telegram.app' -type d | head -5
            exit 1
          fi
          echo "IPA at: $IPA"
          cp "$IPA" $OUTPUT_PATH/

          # collect dsym
          mkdir -p build/DSYMs
          find -L bazel-out -maxdepth 10 -path '*/bin/Telegram/*.dSYM' -type d 2>/dev/null | while read -r f; do
            name="$(basename "$f")"
            if [ -e "build/DSYMs/$name" ]; then
              continue
            fi
            rm -rf "build/DSYMs/$name"
            cp -R "$f" "build/DSYMs/$name" || true
            chmod -R u+w "build/DSYMs/$name" 2>/dev/null || true
          done
          if [ -d bazel-bin/Telegram/Telegram.app.dSYM ]; then
            cp -R bazel-bin/Telegram/Telegram.app.dSYM build/DSYMs/
          fi
          if [ -z "$(ls -A build/DSYMs 2>/dev/null)" ]; then
            echo "no dSYMs found (continuing without them)"
          else
            zip -r "./$OUTPUT_PATH/Telegram.DSYMs.zip" build/DSYMs 1>/dev/null
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-unsigned-ipa
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          if-no-files-found: error

      - name: Upload dSYM artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-dSYMs
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
          if-no-files-found: error